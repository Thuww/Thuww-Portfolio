<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

            <rect width="1280" height="720" fill="#070913"/>
            <defs>
                <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#190d2e"/>
                    <stop offset="100%" stop-color="#050711"/>
                </linearGradient>
            </defs>
            <rect width="1280" height="720" fill="url(#bgGrad2)"/>
            
            <!-- Top bar -->
            <rect x="0" y="0" width="1280" height="50" fill="#000000" fill-opacity="0.5"/>
            <text x="40" y="32" fill="#ec4899" font-family="monospace" font-size="14" font-weight="bold">AI IDOL JISOO • COMPANION ATELIER</text>
            <rect x="1100" y="12" width="140" height="26" rx="13" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1"/>
            <text x="1170" y="29" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🔴 30 FPS STREAM</text>

            <!-- Left Persona Profile Card -->
            <rect x="40" y="80" width="380" height="580" rx="16" fill="#0f1322" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
            
            <!-- Avatar Circle Representation -->
            <circle cx="230" cy="200" r="80" fill="#241442" stroke="#ec4899" stroke-width="3"/>
            <text x="230" y="208" fill="#f472b6" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle">JISOO</text>
            
            <text x="230" y="320" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Kim Jisoo (AI Twin)</text>
            <text x="230" y="345" fill="#a855f7" font-family="monospace" font-size="13" text-anchor="middle">Affection Level: 80 / 100 [DEVOTED]</text>
            
            <!-- Stats bars -->
            <g transform="translate(70, 380)">
                <text x="0" y="15" fill="#94a3b8" font-family="monospace" font-size="12">Vocal Power</text>
                <rect x="120" y="5" width="180" height="10" rx="5" fill="#1e293b"/>
                <rect x="120" y="5" width="180" height="10" rx="5" fill="#ec4899"/>
                <text x="310" y="15" fill="#ec4899" font-family="monospace" font-size="12">20/20</text>
                
                <text x="0" y="45" fill="#94a3b8" font-family="monospace" font-size="12">Dance Agility</text>
                <rect x="120" y="35" width="180" height="10" rx="5" fill="#1e293b"/>
                <rect x="120" y="35" width="81" height="10" rx="5" fill="#38bdf8"/>
                <text x="310" y="45" fill="#38bdf8" font-family="monospace" font-size="12">9/20</text>

                <text x="0" y="75" fill="#94a3b8" font-family="monospace" font-size="12">Visual Charisma</text>
                <rect x="120" y="65" width="180" height="10" rx="5" fill="#1e293b"/>
                <rect x="120" y="65" width="153" height="10" rx="5" fill="#a855f7"/>
                <text x="310" y="75" fill="#a855f7" font-family="monospace" font-size="12">17/20</text>

                <text x="0" y="105" fill="#94a3b8" font-family="monospace" font-size="12">Global Fame</text>
                <rect x="120" y="95" width="180" height="10" rx="5" fill="#1e293b"/>
                <rect x="120" y="95" width="153" height="10" rx="5" fill="#eab308"/>
                <text x="310" y="105" fill="#eab308" font-family="monospace" font-size="12">17/20</text>
            </g>

            <!-- Action Badges -->
            <rect x="60" y="560" width="70" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4"/>
            <text x="95" y="595" fill="#ffffff" font-size="11" text-anchor="middle">IMAGE</text>
            <rect x="145" y="560" width="70" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4"/>
            <text x="180" y="595" fill="#ffffff" font-size="11" text-anchor="middle">VIDEO</text>
            <rect x="230" y="560" width="70" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4"/>
            <text x="265" y="595" fill="#ffffff" font-size="11" text-anchor="middle">MUSIC</text>
            <rect x="315" y="560" width="85" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-opacity="0.4"/>
            <text x="357" y="595" fill="#ffffff" font-size="11" text-anchor="middle">STARTER</text>

            <!-- Right Live Dialogue Chat Area -->
            <rect x="450" y="80" width="790" height="580" rx="16" fill="#0c101d" stroke="#334155" stroke-width="1"/>
            <text x="480" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="bold">Live Persona Dialogue Stream</text>
            <line x1="450" y1="145" x2="1240" y2="145" stroke="#334155"/>

            <!-- Message 1 (Producer) -->
            <rect x="750" y="170" width="460" height="60" rx="12" fill="#7e22ce"/>
            <text x="770" y="195" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Producer:</text>
            <text x="770" y="215" fill="#f3e8ff" font-family="sans-serif" font-size="13">"Jisoo, hôm nay lookbook digital atelier của Ortho đã chuẩn bị thế nào rồi?"</text>

            <!-- Message 2 (Jisoo AI) -->
            <rect x="480" y="250" width="600" height="90" rx="12" fill="#1e2438" stroke="#ec4899" stroke-opacity="0.4"/>
            <text x="505" y="275" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="bold">Jisoo AI:</text>
            <text x="505" y="298" fill="#ffffff" font-family="sans-serif" font-size="13">"Producer-nim! Em đã chuẩn bị sẵn sàng bộ sưu tập Hologram Cyberpunk rồi ạ!"</text>
            <text x="505" y="320" fill="#94a3b8" font-family="sans-serif" font-size="12">"Tất cả metadata và trang phục 3D đều đã liên kết hoàn tất với smart contract onchain."</text>

            <!-- Message 3 (System Action) -->
            <rect x="520" y="370" width="520" height="40" rx="8" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-opacity="0.4"/>
            <text x="780" y="395" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">✨ Jisoo AI đã mở khóa Lookbook 3D Atelier • Credits còn lại: 5,000</text>
            
            <!-- Bottom Input Bar Mockup -->
            <rect x="480" y="580" width="640" height="50" rx="25" fill="#1e293b" stroke="#475569"/>
            <text x="510" y="611" fill="#64748b" font-family="sans-serif" font-size="14">Nhắn tin cho Jisoo AI hoặc gửi câu lệnh tạo ảnh...</text>
            <circle cx="1170" cy="605" r="22" fill="#ec4899"/>
            <text x="1170" y="611" fill="#ffffff" font-size="16" text-anchor="middle">→</text>
        
</svg>