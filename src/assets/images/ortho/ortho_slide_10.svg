            <!-- Rarity Badge -->
            <rect x="330" y="70" width="110" height="30" rx="6" fill="#facc15"/>
            <text x="385" y="90" fill="#000000" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">★ MYTHIC</text>
            
            <text x="460" y="92" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Lush Tale Watercolor</text>

            <!-- 4-Quadrant Preview Canvas -->
            <g transform="translate(330, 120)">
                <!-- Quad 1 -->
                <rect x="0" y="0" width="300" height="170" rx="10" fill="#14532d"/>
                <text x="150" y="95" fill="#86efac" font-size="16" text-anchor="middle">Bamboo Grove</text>
                <!-- Quad 2 -->
                <rect x="320" y="0" width="300" height="170" rx="10" fill="#0c4a6e"/>
                <text x="470" y="95" fill="#7dd3fc" font-size="16" text-anchor="middle">Floating Islet</text>
                <!-- Quad 3 -->
