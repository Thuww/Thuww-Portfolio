<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

            <rect width="1280" height="720" fill="#090a13"/>
            <!-- Left Persona Chat panel -->
            <rect x="40" y="40" width="560" height="640" rx="16" fill="#101322" stroke="#3b82f6" stroke-width="1.5"/>
            <text x="70" y="85" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">Potion Spawwww Assistant</text>
            <text x="70" y="110" fill="#94a3b8" font-family="monospace" font-size="12">Model: Pixel Neon Realism v2.4</text>
            
            <line x1="40" y1="130" x2="600" y2="130" stroke="#1e293b"/>

            <rect x="70" y="160" width="480" height="100" rx="12" fill="#1e293b"/>
            <text x="95" y="195" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Prompt:</text>
            <text x="95" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="13">"Cyberpunk anime girl wearing glowing neon bomber jacket, futuristic visor, rainy Tokyo backdrop."</text>

            <rect x="70" y="280" width="500" height="80" rx="12" fill="#172554"/>
            <text x="95" y="315" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Spawwww AI:</text>
            <text x="95" y="338" fill="#e0f2fe" font-family="sans-serif" font-size="13">"Generating 6 variants with high chromatic aberration and volumetric rain reflection."</text>

            <!-- Right Generated Avatar Gallery -->
            <rect x="640" y="40" width="600" height="640" rx="16" fill="#0c101d" stroke="#a855f7" stroke-width="1.5"/>
            <text x="670" y="85" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Generated Persona Gallery (6)</text>
            
            <!-- 6 Image Thumbnails -->
            <g transform="translate(670, 120)">
                <rect x="0" y="0" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#ec4899"/>
                <circle cx="80" cy="90" r="45" fill="#3b0764"/>
                <text x="80" y="190" fill="#f472b6" font-family="monospace" font-size="12" text-anchor="middle">Variant #1</text>

                <rect x="185" y="0" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#38bdf8"/>
                <circle cx="265" cy="90" r="45" fill="#082f49"/>
                <text x="265" y="190" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">Variant #2</text>

                <rect x="370" y="0" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#a855f7"/>
                <circle cx="450" cy="90" r="45" fill="#311042"/>
                <text x="450" y="190" fill="#c084fc" font-family="monospace" font-size="12" text-anchor="middle">Variant #3</text>

                <rect x="0" y="260" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#eab308"/>
                <circle cx="80" cy="350" r="45" fill="#422006"/>
                <text x="80" y="450" fill="#facc15" font-family="monospace" font-size="12" text-anchor="middle">Variant #4</text>

                <rect x="185" y="260" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#22c55e"/>
                <circle cx="265" cy="350" r="45" fill="#052e16"/>
                <text x="265" y="450" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">Variant #5</text>

                <rect x="370" y="260" width="160" height="230" rx="10" fill="#1e1b4b" stroke="#f43f5e"/>
                <circle cx="450" cy="350" r="45" fill="#4c0519"/>
                <text x="450" y="450" fill="#fb7185" font-family="monospace" font-size="12" text-anchor="middle">Variant #6</text>
            </g>
        
</svg>