<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

            <rect width="1280" height="720" fill="#090a16"/>
            <!-- Cyber City Grid Background -->
            <defs>
                <pattern id="grid12" width="60" height="60" patternUnits="userSpaceOnUse">
                    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="1280" height="720" fill="url(#grid12)"/>

            <!-- Header -->
            <rect x="0" y="0" width="1280" height="55" fill="#000000" fill-opacity="0.6"/>
            <text x="50" y="35" fill="#c084fc" font-family="sans-serif" font-size="16" font-weight="bold">3D SWARM CYBER TOWN MAP • SECTOR 7</text>
            <text x="1230" y="35" fill="#4ade80" font-family="monospace" font-size="14" text-anchor="end">80,347 $AIAI IN TREASURY</text>

            <!-- Isometric Building Blocks Representation -->
            <!-- Block 1 -->
            <polygon points="400,280 550,220 700,280 550,340" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
            <polygon points="400,280 550,340 550,480 400,420" fill="#0f0e26" stroke="#8b5cf6" stroke-width="2"/>
            <polygon points="550,340 700,280 700,420 550,480" fill="#18173d" stroke="#8b5cf6" stroke-width="2"/>

            <!-- Cherry Blossoms Tree Visual -->
            <circle cx="300" cy="420" r="50" fill="#f472b6" fill-opacity="0.8"/>
            <circle cx="850" cy="380" r="60" fill="#f472b6" fill-opacity="0.8"/>

            <!-- Interactive Waypoints (Nodes 1-6) -->
            <!-- Pin 1 -->
            <circle cx="450" cy="220" r="16" fill="#3b82f6"/>
            <text x="450" y="225" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">#1</text>
            <!-- Pin 2 -->
            <circle cx="650" cy="200" r="16" fill="#a855f7"/>
            <text x="650" y="205" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">#2</text>
            <!-- Pin 3 (Swarm General) -->
            <circle cx="550" cy="300" r="22" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
            <text x="550" y="306" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">#3</text>
            <!-- Pin 4 -->
            <circle cx="340" cy="350" r="16" fill="#eab308"/>
            <text x="340" y="355" fill="#000000" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">#4</text>
            <!-- Pin 5 -->
            <circle cx="780" cy="320" r="16" fill="#22c55e"/>
            <text x="780" y="325" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">#5</text>
            <!-- Pin 6 -->
            <circle cx="550" cy="450" r="16" fill="#06b6d4"/>
            <text x="550" y="455" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">#6</text>

            <!-- Speech bubble from Pin 3 -->
            <rect x="580" y="220" width="340" height="60" rx="10" fill="#0f172a" stroke="#ec4899"/>
            <text x="600" y="245" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold">Swarm 3 General:</text>
            <text x="600" y="265" fill="#e2e8f0" font-family="sans-serif" font-size="12">"256 agent sub-routines active across Cyber Town."</text>

            <!-- Bottom command bar -->
            <rect x="340" y="620" width="600" height="50" rx="25" fill="#000000" stroke="#475569"/>
            <text x="640" y="651" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">⌘ STYLE YOUR REALITY • 6 ACTIVE SWARM NODES</text>
        
</svg>